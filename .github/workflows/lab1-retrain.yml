name: Lab 1 - Retrain model on push

on:
  push:
    branches: [main]
    paths:
      - "lab1-github-actions/**"
      - "!lab1-github-actions/**/*.md"
      - ".github/workflows/lab1-retrain.yml"

defaults:
  run:
    working-directory: lab1-github-actions

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  retrain:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate a run timestamp
        run: echo "timestamp=$(date '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Train
        run: python src/train_model.py --timestamp "$timestamp"

      - name: Evaluate
        run: python src/evaluate_model.py --timestamp "$timestamp"

      - name: Gate against the champion
        id: gate
        run: python src/gate.py --timestamp "$timestamp"

      - name: Upload the promoted model
        if: steps.gate.outputs.decision == 'promote'
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ env.timestamp }}
          path: |
            lab1-github-actions/model_${{ env.timestamp }}_dt_model.joblib
            lab1-github-actions/${{ env.timestamp }}_metrics.json
          retention-days: 90

      - name: Commit the new champion record
        if: steps.gate.outputs.decision == 'promote'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champion.json
          git commit -m "lab1: promote model ${timestamp} to champion"
          git push
