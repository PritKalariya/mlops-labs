name: Lab 1 - Retrain model on push

on:
  push:
    branches: [main]
    paths:
      - "lab1-github-actions/**"
      - ".github/workflows/lab1-retrain.yml"

defaults:
  run:
    working-directory: lab1-github-actions

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  retrain:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate a run timestamp
        run: echo "timestamp=$(date '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Train
        run: python src/train_model.py --timestamp "$timestamp"

      - name: Evaluate
        run: python src/evaluate_model.py --timestamp "$timestamp"

      - name: Version the model and metrics
        run: |
          mkdir -p models metrics
          mv "model_${timestamp}_dt_model.joblib" models/
          mv "${timestamp}_metrics.json" metrics/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models metrics
          git commit -m "lab1: retrained model and metrics for ${timestamp}"
          git push
